{% extends "base.html" %}
{% block body %}
<style>
  .split { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; background: #fff; color: #0f172a;
           font-family: "Pretendard", "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .split .side { background: #f1f5f9; padding: 60px; display: flex; flex-direction: column; justify-content: space-between; }
  .split .brand { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 10px; }
  .split .brand i { width: 28px; height: 28px; border-radius: 8px; background: #2563eb; display: inline-block; }
  .split .side h2 { font-size: 34px; line-height: 1.35; margin: 0; font-weight: 700; }
  .split .side p { color: #64748b; margin: 14px 0 0; font-size: 15px; }
  .split .team { display: grid; gap: 4px; }
  .split .team-label { color: #2563eb; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  .split .team-names { color: #0f172a; font-size: 15px; font-weight: 600; }
  .split .side small { color: #94a3b8; font-size: 12px; margin-top: 4px; }
  .split .main { display: grid; place-items: center; padding: 32px 16px; }
  .split .form { width: 100%; max-width: 340px; }
  .split h1 { font-size: 24px; margin: 0 0 28px; }
  .split label { color: #475569; font-size: 13px; font-weight: 500; margin-bottom: 18px; }
  .split input { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; font-size: 15px; margin-top: 8px; outline: none; transition: border-color .15s, box-shadow .15s; }
  .split input::placeholder { color: #b6c0cc; }
  .split input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .15); }
  .split button, .split .btn { width: 100%; border: 0; border-radius: 10px; padding: 13px; background: #2563eb; color: #fff;
                               font-size: 15px; font-weight: 700; text-align: center; margin-top: 6px; }
  .split button:hover, .split .btn:hover { background: #1d4ed8; }
  .split .btn-ghost { background: #fff; color: #0f172a; border: 1px solid #e2e8f0; }
  .split .btn-ghost:hover { background: #f8fafc; }
  .split .note { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 22px; }
  .split .alert { display: flex; gap: 10px; align-items: flex-start; border: 0; border-radius: 10px; padding: 12px 14px;
                  margin-bottom: 22px; font-size: 14px; line-height: 1.5; background: #fefce8; color: #854d0e; border: 1px solid #fde68a; }
  .split .alert::before { content: "!"; flex: none; width: 20px; height: 20px; border-radius: 50%; background: #eab308; color: #fff;
                          font-size: 12px; font-weight: 800; display: grid; place-items: center; margin-top: 1px; }
  .split .alert-block { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
  .split .alert-block::before { background: #dc2626; }
  .split .ok-icon { width: 48px; height: 48px; border-radius: 50%; background: #eff6ff; color: #2563eb; display: grid; place-items: center;
                    font-size: 22px; font-weight: 800; margin-bottom: 20px; }
  .split .sub { color: #64748b; font-size: 14px; margin: -18px 0 28px; }
  .split .stack { display: grid; gap: 8px; }
  @media (max-width: 820px) {
    .split { grid-template-columns: 1fr; }
    .split .side { padding: 28px 20px; gap: 18px; }
    .split .side h2 { font-size: 24px; }
  }
</style>
<div class="split">
  <aside class="side">
    <div class="brand"><i></i>SecureLogin</div>
    <div>
      <h2>같은 공격,<br>두 겹의 방어</h2>
      <p>실패 횟수 제한과 네트워크 탐지로 지키는 로그인</p>
    </div>
    <div class="team"><span class="team-label">SKT ALEPH 팀 프로젝트</span><span class="team-names">전지은 · 권빈</span><small>격리된 실습 환경 전용</small></div>
  </aside>
  <main class="main">
    <div class="form">
      {% block content %}{% endblock %}
    </div>
  </main>
</div>
{% endblock %}
