<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SecureLogin{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f4; --ink: #14212d; --muted: #5b6672; --line: #d9ddd8; --card: #ffffff;
    --accent: #179c86; --accent-soft: #e6f2ef; --warn: #c78a12; --block: #c0392b; --ok: #1f8a4c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  .eyebrow { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em;
             color: var(--accent); font-size: 12px; font-weight: 700; margin: 0 0 6px; }
  h1 { margin: 0 0 20px; font-size: 26px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  button, .btn { border: 0; border-radius: 8px; padding: 10px 16px; font: inherit; font-weight: 600;
                 cursor: pointer; background: var(--ink); color: #fff; text-decoration: none; display: inline-block; }
  .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn-danger { background: var(--block); }
  input, select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px;
                  font: inherit; margin-top: 6px; background: #fff; }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 14px; }

  /* 로그인 */
  .auth { min-height: 100vh; display: grid; place-items: center; padding: 16px;
          background: linear-gradient(135deg, #14212d, #1d3a40); }
  .auth .card { background: var(--card); width: 100%; max-width: 380px; padding: 32px; border-radius: 14px; }
  .auth button { width: 100%; margin-top: 6px; }
  .alert { padding: 11px 13px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;
           background: #fdf3e1; color: #7a5208; border-left: 4px solid var(--warn); }
  .alert-block { background: #fbe9e7; color: #8e2a1f; border-left-color: var(--block); }

  /* 관리자 */
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 16px 60px; }
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .top h1 { margin: 0; }
  .grid { display: grid; gap: 16px; }
  .g4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .stat .num { font-size: 28px; font-weight: 800; }
  .stat .cap { color: var(--muted); font-size: 13px; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .pill-on { background: var(--accent-soft); color: var(--accent); }
  .pill-off { background: #f1e4e2; color: var(--block); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .tag-ok { background: #e2f3e9; color: var(--ok); }
  .tag-warn { background: #fbf0d9; color: #8a5f0b; }
  .tag-block { background: #fbe4e1; color: var(--block); }
  .tag-action { background: var(--ink); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  .scroll { overflow-x: auto; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .row label { margin: 0; flex: 1; min-width: 160px; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 140px; padding-top: 6px; }
  .bar { flex: 1; position: relative; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 1px; }
  .bar .rej { position: absolute; bottom: 0; left: 0; right: 0; background: var(--block); border-radius: 3px 3px 0 0; }
  .bar.has-success { outline: 2px solid var(--warn); }
  .bar-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; margin-right: 12px; font-size: 12px; color: var(--muted); }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .breach { color: var(--block); font-weight: 700; }
  .safe { color: var(--ok); font-weight: 700; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
